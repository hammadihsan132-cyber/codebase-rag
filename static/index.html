<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>CodeBase RAG AI Assistant</title>

<style>

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f6feb;
  --success: #3fb950;
  --error: #f85149;
  --mono: "SFMono-Regular", Consolas, monospace;
}


* {
  box-sizing: border-box;
}


body {

  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

  min-height:100vh;

  display:flex;
  justify-content:center;

  padding:2.5rem 1.5rem;

}



.wrap {

 width:100%;
 max-width:850px;

}



h1 {

 font-size:1.5rem;
 margin:0 0 .3rem;

 display:flex;
 align-items:center;
 gap:.5rem;

}



.tag {

 font-family:var(--mono);

 font-size:.7rem;

 color:var(--accent);

 border:1px solid var(--accent-dim);

 padding:.15rem .45rem;

 border-radius:5px;

}



.subtitle {

 color:var(--muted);

 margin-bottom:1.5rem;

 font-size:.9rem;

}



.panel {

 background:var(--panel);

 border:1px solid var(--border);

 border-radius:12px;

 padding:1.25rem;

 margin-bottom:1.2rem;

}



.row {

 display:flex;

 gap:.6rem;

}



input[type="text"] {

 flex:1;

 background:#0d1117;

 border:1px solid var(--border);

 border-radius:7px;

 color:var(--text);

 padding:.7rem .8rem;

 font-size:.9rem;

 font-family:var(--mono);

}



input[type="text"]:focus {

 outline:none;

 border-color:var(--accent-dim);

}



button {

 background:var(--accent-dim);

 color:white;

 border:none;

 border-radius:7px;

 padding:.65rem 1.2rem;

 cursor:pointer;

 font-weight:500;

}



button:hover {

 background:var(--accent);

}



button:disabled {

 opacity:.5;

 cursor:not-allowed;

}



button.secondary {

 background:transparent;

 border:1px solid var(--border);

 color:var(--muted);

}



select {

 width:100%;

 background:#0d1117;

 border:1px solid var(--border);

 border-radius:7px;

 color:var(--text);

 padding:.7rem;

 font-family:var(--mono);

}



.mode-section {

 margin-bottom:1rem;

}



.mode-title {

 color:var(--muted);

 font-size:.85rem;

 margin-bottom:.4rem;

}



.mode-description {

 margin-top:.5rem;

 padding:.7rem;

 border-radius:8px;

 background:#0d1117;

 border:1px solid var(--border);

 color:var(--muted);

 font-size:.82rem;

}



.status {

 margin-top:.6rem;

 min-height:1rem;

 font-size:.85rem;

 color:var(--muted);

}



.status.error {

 color:var(--error);

}



.status.success {

 color:var(--success);

}



.qa {

 display:flex;

 flex-direction:column;

 gap:1rem;

}



.qa-item {

 border:1px solid var(--border);

 border-radius:10px;

 overflow:hidden;

 background:var(--panel);

}



.q-bubble {

 background:#1c2530;

 padding:.8rem 1rem;

 color:var(--accent);

 font-weight:500;

}



.a-bubble {

 padding:1rem;

 line-height:1.6;

 white-space:pre-wrap;

}



.citations {

 border-top:1px solid var(--border);

 padding:.7rem 1rem;

 font-family:var(--mono);

 font-size:.78rem;

 color:var(--muted);

}



.empty-state {

 color:var(--muted);

 text-align:center;

 padding:2rem;

}



</style>

</head>


<body>


<div class="wrap">

<h1>
CodeBase RAG AI Assistant
<span class="tag">v2</span>
</h1>


<div class="subtitle">
Analyze GitHub repositories and learn code with AI guidance.
</div>


<div class="panel">


<div class="row">

<input 
id="repoUrl"
type="text"
placeholder="https://github.com/owner/repo"
/>


<button id="ingestBtn" onclick="doIngest()">
Analyze
</button>


</div>


<div id="ingestStatus" class="status"></div>


</div>

<div class="panel">


<div class="row" style="margin-bottom:0.8rem;">


<select id="repoSelect" onchange="onRepoSelect()">

<option value="">
Select an analyzed repository...
</option>

</select>


<button 
class="secondary"
onclick="loadRepos()">
Refresh
</button>


</div>



<div class="mode-section">


<div class="mode-title">
Choose AI Assistant Mode
</div>


<select id="aiMode" onchange="updateModeDescription()">



<option value="developer">
👨‍💻 Developer Mode
</option>


<option value="student">
📚 Student Tutor Mode
</option>


<option value="debug">
🐞 Debug Mode
</option>


<option value="viva">
🎓 Viva Preparation Mode
</option>


</select>



<div 
id="modeDescription"
class="mode-description">

Technical explanation with file references and architecture details.

</div>


</div>





<div class="row">


<input

type="text"

id="question"

placeholder="Ask something about this codebase..."

onkeydown="if(event.key==='Enter') doQuery();"

/>


<button

id="queryBtn"

onclick="doQuery()">

Ask AI

</button>


</div>



<div id="queryStatus" class="status"></div>


</div>





<div class="qa" id="qaLog">


<div class="empty-state" id="emptyState">

Analyze a repository and ask questions.
Your answers will include source citations.

</div>


</div>


</div>





<script>


const API = "";



const modeDescriptions = {


developer:
"Technical explanation with file references, architecture details, and implementation insights.",


student:
"Explains code step-by-step using simple language like a programming teacher.",


debug:
"Analyzes errors, finds possible causes, and suggests fixes.",


viva:
"Creates university viva questions with answers from your project."


};



function updateModeDescription(){


const mode =
document.getElementById("aiMode").value;


document.getElementById("modeDescription").textContent =
modeDescriptions[mode];


}





async function loadRepos(){


const select =
document.getElementById("repoSelect");


try{


const res =
await fetch(`${API}/api/repos`);


const repos =
await res.json();



const current =
select.value;



select.innerHTML =
`
<option value="">
Select an analyzed repository...
</option>
`;



repos.forEach(r=>{


const option =
document.createElement("option");


option.value =
`${r.owner}/${r.repo}`;


option.textContent =
`${r.owner}/${r.repo}`;


select.appendChild(option);



});



if(current)
select.value=current;



}

catch(error){

console.error(error);

}



}




function onRepoSelect(){

}





function setStatus(id,text,type){


const el =
document.getElementById(id);


el.textContent=text;


el.className =
"status " + (type || "");


}





async function doIngest(){


const url =
document.getElementById("repoUrl").value.trim();



if(!url){

setStatus(
"ingestStatus",
"Enter a GitHub URL first.",
"error"
);

return;

}



const btn =
document.getElementById("ingestBtn");


btn.disabled=true;



setStatus(
"ingestStatus",
"Analyzing repository..."
);



try{


const res =
await fetch(
`${API}/api/ingest`,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify({
url:url
})

}

);



const data =
await res.json();



if(!res.ok)
throw new Error(data.detail);



setStatus(

"ingestStatus",

`✓ ${data.full_name} analyzed successfully.`,

"success"

);



await loadRepos();



document.getElementById("repoSelect").value =
data.full_name;



}


catch(error){


setStatus(

"ingestStatus",

"✗ "+error.message,

"error"

);



}


finally{


btn.disabled=false;


}



}
async function doQuery(){


const repo =
document.getElementById("repoSelect").value;


const question =
document.getElementById("question").value.trim();


const mode =
document.getElementById("aiMode").value;



if(!repo){

setStatus(
"queryStatus",
"Select a repository first.",
"error"
);

return;

}



if(!question){

setStatus(
"queryStatus",
"Enter a question.",
"error"
);

return;

}



const btn =
document.getElementById("queryBtn");


btn.disabled=true;



setStatus(
"queryStatus",
"Thinking..."
);



const empty =
document.getElementById("emptyState");


if(empty)
empty.remove();



try{


const res =
await fetch(
`${API}/api/query`,
{


method:"POST",


headers:{
"Content-Type":"application/json"
},


body:
JSON.stringify({

repo:repo,

question:question,

mode:mode,

n_results:10

})


}

);



const data =
await res.json();



if(!res.ok)
throw new Error(data.detail);



appendQA(

question,

data.answer,

data.citations,

mode

);



document.getElementById("question").value="";



setStatus(
"queryStatus",
"",
""
);



}


catch(error){


setStatus(

"queryStatus",

"✗ "+error.message,

"error"

);



}


finally{


btn.disabled=false;


}


}






function appendQA(question,answer,citations,mode){



const log =
document.getElementById("qaLog");



const item =
document.createElement("div");


item.className="qa-item";



const q =
document.createElement("div");


q.className="q-bubble";


q.textContent =
`${mode.toUpperCase()} MODE\n\nQ: ${question}`;



item.appendChild(q);





const a =
document.createElement("div");


a.className="a-bubble";


a.textContent=answer;



item.appendChild(a);





if(citations && citations.length){



const cites =
document.createElement("div");


cites.className="citations";



cites.innerHTML =
"<b>Sources:</b>";



citations.forEach(c=>{


const line =
document.createElement("div");


const symbol =
c.symbol_name
?
` (${c.symbol_name})`
:
"";



line.textContent =
`[${c.index}] ${c.file_path}:${c.start_line}-${c.end_line}${symbol}`;



cites.appendChild(line);



});



item.appendChild(cites);



}



log.prepend(item);



}




loadRepos();

updateModeDescription();



</script>


</body>

</html>
